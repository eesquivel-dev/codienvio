services:
  postgres:
    image: postgres:16-alpine
    container_name: codienvio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codienvio
      POSTGRES_PASSWORD: codienvio
      POSTGRES_DB: codienvio
    ports:
      - "5432:5432"
    volumes:
      - codienvio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codienvio -d codienvio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  codienvio_pgdata:
